name: Deploy TopSafeB to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate dashboard JavaScript
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const files = ['admin.html', 'dashboard.html', 'login.html'];
          for (const file of files) {
            const html = fs.readFileSync(file, 'utf8');
            const scripts = [...html.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script>/gi)];
            if (!scripts.length) throw new Error(`No JavaScript found in ${file}`);
            scripts.forEach((match, index) => {
              const code = match[1].replace(/^\\s*import\\s+\\{[^}]+\\}\\s+from\\s+["'][^"']+["'];?\\s*/m, '');
              try {
                new Function(code);
              } catch (error) {
                throw new Error(`${file}, script ${index + 1}: ${error.message}`);
              }
            });
            console.log(`JavaScript syntax OK: ${file}`);
          }
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Bundle Supabase sign-in library locally
        run: |
          npm install --prefix /tmp/topsafeb-vendor --no-save @supabase/supabase-js@2
          test -s /tmp/topsafeb-vendor/node_modules/@supabase/supabase-js/dist/umd/supabase.js
          cp /tmp/topsafeb-vendor/node_modules/@supabase/supabase-js/dist/umd/supabase.js ./supabase.js
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
