name: Deploy TopSafeB to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Bundle Supabase sign-in library locally
        run: |
          npm install --prefix /tmp/topsafeb-vendor --no-save @supabase/supabase-js@2
          test -s /tmp/topsafeb-vendor/node_modules/@supabase/supabase-js/dist/umd/supabase.js
          cp /tmp/topsafeb-vendor/node_modules/@supabase/supabase-js/dist/umd/supabase.js ./supabase.js
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
