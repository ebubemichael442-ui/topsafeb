<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Sign in or create a TopSafeB account.">
<title>TopSafeB | Customer Access</title>
<style>
:root{--navy:#102b50;--blue:#194875;--gold:#dfbd70;--ink:#183252}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;display:flex;flex-direction:column}
header{padding:22px 6%;font-size:25px;font-weight:800;letter-spacing:.2px}
.brand-mark{display:inline-grid;place-items:center;width:42px;height:42px;border:2px solid var(--gold);border-radius:12px;color:var(--gold);margin-right:9px}
main{width:min(680px,100%);margin:auto;padding:48px 6% 70px;text-align:center}
h1{font-size:clamp(36px,7vw,58px);line-height:1.12;margin:0 0 20px}
p{font-size:19px;line-height:1.6;color:#e3ebf5;margin:0 auto 34px;max-width:560px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.button{display:block;padding:17px 14px;border-radius:10px;font-size:17px;font-weight:800;text-decoration:none;transition:filter .18s ease,transform .18s ease}
.button:hover{filter:brightness(1.06);transform:translateY(-1px)}
.signup{background:var(--gold);color:var(--navy)}
.login{border:1px solid #b8c9dc;color:#fff;background:transparent}
footer{text-align:center;padding:18px 6%;font-size:13px;color:#d8e2ee}
@media(max-width:480px){main{padding-top:32px}.actions{grid-template-columns:1fr}.button{width:100%}}
</style>
</head>
<body>
<header><span class="brand-mark">T</span>TopSafeB</header>
<main>
<h1>Welcome to TopSafeB</h1>
<p>Access your TopSafeB account. Sign in if you already have an account, or create a new account to get started.</p>
<div class="actions">
<a class="button signup" href="login.html#signup">Sign Up</a>
<a class="button login" href="login.html">Login</a>
</div>
</main>
<footer>TopSafeB · Independent financial information</footer>
</body>
</html>
