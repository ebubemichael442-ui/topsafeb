<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Track a Package | TopSafeB</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f6f3;color:#20352d;font:15px/1.55 Arial,sans-serif}header{background:linear-gradient(110deg,#103b30,#176b4b);color:white;padding:22px max(18px,calc((100% - 960px)/2));font-weight:800;font-size:22px;letter-spacing:.2px}main{max-width:960px;margin:34px auto;padding:0 18px 60px}.panel{background:white;border:1px solid #e0e9e3;border-radius:20px;padding:26px;box-shadow:0 14px 34px #163d2b10}h1{margin:0 0 8px;color:#123b30;font-size:clamp(26px,5vw,36px)}h2{color:#123b30;margin:10px 0}.muted{color:#687d73}.search{display:flex;gap:10px;margin-top:20px}input{min-width:0;flex:1;padding:14px;border:1px solid #cbd8cf;border-radius:10px;font:inherit;text-transform:uppercase;letter-spacing:.5px}button{border:0;border-radius:9px;padding:13px 18px;background:linear-gradient(110deg,#176b4b,#21845c);color:white;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 5px 14px #176b4b22}button:disabled{opacity:.6;cursor:wait}#status{margin-top:18px;padding:13px 15px;border-radius:10px;background:#f1f6f2;color:#315b43;overflow-wrap:anywhere}.result{margin-top:22px}.tracking-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:18px;background:#f6faf7;border:1px solid #e4ede6;border-radius:14px}.tracking-code{font-weight:800;letter-spacing:1.2px;font-size:18px;color:#153f31}.copy-btn{background:#e5f1e9;color:#176b4b;box-shadow:none;padding:9px 12px}.pill{display:inline-flex;align-items:center;padding:6px 12px;border-radius:30px;background:#e5f4e9;color:#176b4b;font-weight:800;font-size:12px}.section-title{font-size:16px;margin:24px 0 10px;color:#234536}.route{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.route-card{background:#fbfcfb;border:1px solid #e3ece5;border-radius:13px;padding:16px;min-height:90px}.route-card small,.meta-card small,.event small{display:block;color:#718078;font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}.route-card strong{font-size:16px;color:#183d30}.route-line{display:flex;align-items:center;gap:10px;color:#789084;font-size:12px;margin:0 4px}.map-panel{margin-top:14px;border:1px solid #e1ebe4;border-radius:15px;overflow:hidden;background:#f7faf8}.map-panel iframe{display:block;width:100%;height:300px;border:0}.map-caption{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px;color:#52685d;font-size:12px}.map-caption a{color:#176b4b;font-weight:700;text-decoration:none}.route-line:before,.route-line:after{content:"";height:1px;background:#d7e4da;flex:1}.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.meta-card{padding:13px 15px;background:#f7faf8;border:1px solid #e7eee9;border-radius:11px}.meta-card strong{display:block;color:#294a3b}.progress{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:20px 0 7px}.step{height:7px;border-radius:8px;background:#e1e9e3}.step.done{background:#21845c}.step-labels{display:flex;justify-content:space-between;gap:5px;color:#687d73;font-size:10px;margin-bottom:18px}.timeline{display:grid;gap:10px;margin-top:12px}.event{position:relative;background:#fbfcfb;border:1px solid #e3ece5;border-radius:12px;padding:15px 16px 15px 20px}.event:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:#21845c}.event strong{display:block;color:#214635}.event p{margin:5px 0;color:#52685d}.last-update{font-size:12px;color:#718078;margin-top:16px}@media print{body{background:#fff;color:#111}header,#lookup-form,#status,#print-tracking,.map-caption a{display:none!important}main{max-width:none;margin:0;padding:0}.panel{border:0;box-shadow:none;padding:0}.result{display:block!important}.map-panel iframe{height:220px}.event,.route-card,.meta-card,.tracking-head{break-inside:avoid;box-shadow:none}a{color:#111;text-decoration:none}}@media(max-width:560px){.search{flex-direction:column}.route,.meta-grid{grid-template-columns:1fr}.panel{padding:19px}.tracking-code{font-size:16px}}
</style>
</head>
<body>
<header>TopSafeB · Package Tracking</header>
<main>
<section class="panel">
<h1>Track your package</h1>
<p class="muted">Enter the TopSafeB tracking number supplied by the sender to view the latest recorded shipment status.</p>
<form id="lookup-form" class="search"><input id="tracking-number" autocomplete="off" placeholder="Example: TSB-AB12CD34EF" aria-label="Tracking number" required><button id="lookup-button" type="submit">Track package</button></form>
<div id="status" role="status" aria-live="polite">Enter a tracking number to begin.</div>
<div id="result" class="result" hidden></div>

</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
 const status=document.getElementById("status"),result=document.getElementById("result"),form=document.getElementById("lookup-form"),input=document.getElementById("tracking-number"),button=document.getElementById("lookup-button");
 if(!window.supabase||!window.supabase.createClient){status.textContent="The tracking service could not load. Check your connection and refresh.";return;}
 const client=window.supabase.createClient("https://wivxqaratjrrhpeeeboc.supabase.co","sb_publishable_Q3EaQdfgUFy0LCU53qK23A_hEuAjUm6");
 const safe=value=>String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
 const date=value=>value?new Date(value+"T00:00:00").toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}):"Not provided";
 const params=new URLSearchParams(location.search);if(params.get("tracking"))input.value=params.get("tracking").toUpperCase();
 form.addEventListener("submit",async event=>{
  event.preventDefault();button.disabled=true;result.hidden=true;status.textContent="Looking up shipment…";
  try{
   const code=input.value.trim().toUpperCase();
   const {data,error}=await client.rpc("track_top_safeb_package",{p_tracking_number:code});
   if(error)throw error;
   if(!data){status.textContent="No shipment was found for that tracking number. Check the number and try again.";return;}
   status.textContent="Shipment Located — Tracking Details Available";
   const events=Array.isArray(data.events)?data.events:[];const milestones=["Pending","Dispatched","In Transit","Out for Delivery","Delivered"];const current=milestones.indexOf(data.status);const progress=milestones.map((s,i)=>`<div class="step ${current>=0&&i<=current?"done":""}"></div>`).join("");
   const latest=events.length?events[0].created_at:null;
   const mapOrigin=String(data.origin||"").trim(),mapDestination=String(data.destination||"").trim();
   const mapQuery="https://www.google.com/maps?output=embed&saddr="+encodeURIComponent(mapOrigin)+"&daddr="+encodeURIComponent(mapDestination);
   const mapOpen="https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(mapOrigin)+"&destination="+encodeURIComponent(mapDestination);

   result.innerHTML='<div class="tracking-head"><div><small style="display:block;color:#718078;text-transform:uppercase;letter-spacing:.7px;font-size:11px">Shipment reference</small><div class="tracking-code">'+safe(data.tracking_number)+'</div></div><button type="button" class="copy-btn" id="copy-tracking">Copy number</button></div><div style="margin-top:16px"><span class="pill">'+safe(data.status)+'</span></div><div style="display:flex;justify-content:flex-end;margin-top:14px"><button type="button" class="copy-btn" id="print-tracking">Print / Save summary</button></div><h3 class="section-title">Shipment progress</h3><div class="progress">'+progress+'</div><div class="step-labels"><span>Pending</span><span>Dispatched</span><span>In transit</span><span>Out for delivery</span><span>Delivered</span></div><h3 class="section-title">Shipment route</h3><div class="route"><div class="route-card"><small>Origin</small><strong>'+safe(data.origin)+'</strong></div><div class="route-card"><small>Destination</small><strong>'+safe(data.destination)+'</strong></div></div><div class="map-panel"><iframe id="shipment-map" title="Shipment route map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe><div class="map-caption"><span>Route overview · '+safe(data.origin)+' to '+safe(data.destination)+'</span><a id="open-shipment-map" target="_blank" rel="noopener">Open in Maps ↗</a></div></div><div class="meta-grid"><div class="meta-card"><small>Latest recorded location</small><strong>'+safe(events.length&&events[0].location?events[0].location:"Not yet recorded")+'</strong></div><div class="meta-card"><small>Latest shipment update</small><strong>'+safe(latest?new Date(latest).toLocaleString():"No updates yet")+'</strong></div></div>'+(["Exception","Cancelled"].includes(data.status)?'<div class="event" style="margin-top:14px;border-color:#f0c9c2;background:#fff8f6"><strong>'+safe(data.status)+'</strong><p>This shipment is not following the normal delivery progress. Contact the sender for the latest information.</p></div>':'')+'<h3 class="section-title">Delivery information</h3><div class="meta-grid"><div class="meta-card"><small>Dispatch date</small><strong>'+safe(date(data.dispatch_date))+'</strong></div><div class="meta-card"><small>Estimated delivery</small><strong>'+safe(date(data.estimated_delivery_date))+'</strong></div></div><h3 class="section-title">Shipment activity</h3><div class="timeline">'+(events.length?events.map(item=>'<div class="event"><strong>'+safe(item.status)+'</strong><span>'+safe(item.location||"Location not provided")+'</span><p>'+safe(item.note||"Status updated")+'</p><small>'+safe(new Date(item.created_at).toLocaleString())+'</small></div>').join(""):'<p class="muted">No tracking updates have been added yet.</p>')+'</div><div class="last-update">'+(latest?'Latest activity recorded: '+safe(new Date(latest).toLocaleString()):'No activity timestamp available')+'</div>';
   const mapFrame=document.getElementById("shipment-map");if(mapFrame)mapFrame.src=mapQuery;const mapLink=document.getElementById("open-shipment-map");if(mapLink)mapLink.href=mapOpen;
   const printButton=document.getElementById("print-tracking");if(printButton)printButton.addEventListener("click",()=>window.print());
   const copyButton=document.getElementById("copy-tracking");copyButton.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(data.tracking_number);copyButton.textContent="Copied";}catch(_){copyButton.textContent="Select number above";}});
   result.hidden=false;
  }catch(error){status.textContent="Tracking lookup failed: "+(error.message||"Please try again.");}
  finally{button.disabled=false;}
 });
})();
</script>
</body></html>
