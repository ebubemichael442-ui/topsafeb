<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Look up a TopSafeB fictional shipment tracking record.">
<title>Track a Shipment | TopSafeB</title>
<style>
:root{--navy:#102744;--green:#197451;--gold:#d7b56d;--ink:#1d3048;--muted:#68788d;--line:#e2e9f1;--pale:#f3f7f5}
*{box-sizing:border-box}body{margin:0;background:var(--pale);color:var(--ink);font:16px/1.55 Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:17px max(5%,calc((100% - 900px)/2));display:flex;justify-content:space-between;align-items:center;gap:15px}
.brand{font-size:22px;font-weight:900;color:white;text-decoration:none}.brand span{color:var(--gold)}
header a:last-child{color:#fff;text-decoration:none;font-weight:700;font-size:14px}
main{max-width:820px;margin:38px auto;padding:0 18px 60px}
.hero{padding:28px;border-radius:18px;background:linear-gradient(125deg,#102744,#1c5360);color:white}
.hero h1{margin:0 0 8px;font-size:clamp(27px,5vw,38px)}.hero p{margin:0;color:#dce8ef}
.panel{margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:23px;box-shadow:0 8px 25px #1027440a}
form{display:flex;gap:10px;flex-wrap:wrap}input{flex:1 1 250px;min-width:0;padding:14px;border:1px solid #cbd6e0;border-radius:9px;font:inherit;text-transform:uppercase}
button{padding:13px 20px;border:0;border-radius:9px;background:var(--green);color:#fff;font:700 15px Arial;cursor:pointer}
.notice{margin-top:16px;padding:12px 14px;border-left:4px solid var(--gold);background:#fff8e8;color:#654f25;border-radius:8px;font-size:13px}
#result{margin-top:20px}#status{font-size:20px;font-weight:900;color:var(--green)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.item{padding:12px;background:#f7f9fb;border:1px solid #edf1f5;border-radius:9px;overflow-wrap:anywhere}
.item strong{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.timeline{list-style:none;padding:0;margin:12px 0}.timeline li{position:relative;border-left:2px solid #b8d9c6;margin-left:8px;padding:0 0 18px 19px}.timeline li:before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--green);border:2px solid white}
.timeline strong{display:block}.timeline small{color:var(--muted)}.muted{color:var(--muted)}
@media(max-width:560px){.grid{grid-template-columns:1fr}.panel{padding:17px}header{padding:14px 18px}}
</style>
</head>
<body>
<header><a class="brand" href="index.html"><span>◆</span> TopSafeB</a><a href="index.html">Home</a></header>
<main>
<section class="hero"><h1>Track a shipment</h1><p>Enter your tracking code to view its current status and recorded updates.</p></section>
<section class="panel">
<form id="lookup-form"><input id="tracking-code" aria-label="Tracking code" placeholder="Enter tracking code (e.g. TSB-…)" maxlength="40" required><button type="submit">Track shipment</button></form>
<div class="notice"><strong>Fictional tracking simulator.</strong> Records shown here are created by the TopSafeB owner and are not connected to a real courier, postal service or live delivery network.</div>
<p id="lookup-status" class="muted" role="status" aria-live="polite"></p>
<div id="result" hidden></div>
</section>
</main>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const supabase=createClient("https://wivxqaratjrrhpeeeboc.supabase.co","sb_publishable_Q3EaQdfgUFy0LCU53qK23A_hEuAjUm6");
const form=document.getElementById("lookup-form"),input=document.getElementById("tracking-code"),status=document.getElementById("lookup-status"),result=document.getElementById("result");
const el=(tag,value,cls)=>{const n=document.createElement(tag);if(value!==undefined)n.textContent=value;if(cls)n.className=cls;return n;};
const date=value=>{const d=new Date(value);return Number.isNaN(d.getTime())?"—":d.toLocaleString();};
function show(record){
 result.replaceChildren();result.hidden=false;
 const head=el("div","Current status","muted");const current=el("p",record.status);current.id="status";result.append(head,current);
 const grid=el("div",undefined,"grid");
 for(const [label,value] of [["Tracking code",record.tracking_code],["Parcel",record.parcel_description||"—"],["Sender",record.sender_name],["Recipient",record.recipient_name],["From",record.origin_address],["To",record.destination_address],["Created",date(record.created_at)],["Last updated",date(record.updated_at)]]){const item=el("div",undefined,"item");item.append(el("strong",label),el("span",value));grid.append(item);}
 result.append(grid,el("h2","Tracking history"));
 const updates=Array.isArray(record.updates)?record.updates:[];
 if(!updates.length)result.append(el("p","No status updates have been added yet.","muted"));
 else{const list=el("ol",undefined,"timeline");for(const u of updates){const li=el("li");li.append(el("strong",u.status),el("div",u.location||"Location not provided"),el("div",u.note||""),el("small",date(u.created_at)));list.append(li);}result.append(list);}
 result.append(el("p",record.notice,"notice"));
}
form.addEventListener("submit",async event=>{
 event.preventDefault();const code=input.value.trim().toUpperCase();if(!code)return;
 result.hidden=true;status.textContent="Looking up tracking code…";
 const {data,error}=await supabase.rpc("get_public_tracking",{p_tracking_code:code});
 if(error){status.textContent="Tracking lookup is temporarily unavailable. Please try again later.";return;}
 if(!data){status.textContent="No shipment record was found for that tracking code.";return;}
 status.textContent="Tracking record found.";show(data);
});
const params=new URLSearchParams(location.search);const preset=params.get("code");if(preset){input.value=preset;form.requestSubmit();}
</script>
</body></html>
